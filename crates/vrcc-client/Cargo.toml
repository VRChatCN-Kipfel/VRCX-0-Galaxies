[package]
name = "vrcx-0-vrcc-client"
version = "0.1.0"
edition = "2021"
# 和契约 crate 一起构成可复用的 MPL-2.0 部分，不跟工作区的 GPL-3.0-only。
license = "MPL-2.0"
description = "星遇同频（vrcc.cc）开放接口的客户端：限流、会话与请求组装"

[dependencies]
reqwest = { workspace = true, features = ["json", "socks"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }
vrcx-0-vrcc-contracts = { path = "../vrcc-contracts" }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt"] }
