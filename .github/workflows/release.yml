name: Release

on:
    workflow_dispatch:
        inputs:
            expected_channel:
                description: Release channel expected from the committed version
                required: true
                type: choice
                default: stable
                options:
                    - stable
                    - beta

concurrency:
    group: ${{ github.ref }}-package
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    prepare:
        name: Prepare Release Metadata
        runs-on: ubuntu-24.04
        outputs:
            base_version: ${{ steps.version.outputs.base_version }}
            build_version: ${{ steps.version.outputs.build_version }}
            channel: ${{ steps.version.outputs.channel }}
            prerelease: ${{ steps.version.outputs.prerelease }}
            beta_number: ${{ steps.version.outputs.beta_number }}
            display_version: ${{ steps.version.outputs.display_version }}
            tag: ${{ steps.version.outputs.tag }}
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v6
              with:
                  node-version: 24.x

            - uses: dtolnay/rust-toolchain@stable

            - id: version
              name: Read release version
              run: |
                  version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
                  if [[ -z "$version" ]]; then
                      echo "Missing Tauri config version." >&2
                      exit 1
                  fi
                  node scripts/prepare-release-version.ts \
                      --version "$version" \
                      --dry-run

            - name: Validate selected release channel
              run: |
                  if [[ "${{ steps.version.outputs.channel }}" != "${{ inputs.expected_channel }}" ]]; then
                      echo "Committed version belongs to ${{ steps.version.outputs.channel }}, not ${{ inputs.expected_channel }}." >&2
                      exit 1
                  fi

    package:
        name: ${{ matrix.label }}
        needs: prepare
        runs-on: ${{ matrix.os }}
        defaults:
            run:
                shell: bash
        strategy:
            fail-fast: false
            matrix:
                include:
                    - label: Linux Packages
                      os: ubuntu-24.04
                      rust_target: ''
                      artifact_name: linux-packages
                      artifact_path: |
                          target/release/bundle/appimage/*.AppImage
                          target/release/bundle/appimage/*.AppImage.sig
                          target/release/bundle/deb/*.deb
                          target/release/bundle/deb/*.deb.sig
                          target/release/bundle/rpm/*.rpm
                          target/release/bundle/rpm/*.rpm.sig
                          target/release/bundle/latest_linux_and_macos.json
                    - label: macOS DMG (Apple Silicon)
                      os: macos-latest
                      rust_target: aarch64-apple-darwin
                      dmg_asset_arch: macos_aarch64
                      updater_target: macos-aarch64-stable
                      updater_asset_name: update_macos_aarch64.app.tar.gz
                      webkit_build_target: safari18.2
                      build_command: npm run tauri:build -- --target aarch64-apple-darwin --bundles app,dmg
                      artifact_name: macos-aarch64-dmg
                      artifact_path: |
                          target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
                          target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
                          target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
                    - label: macOS DMG (Intel)
                      os: macos-latest
                      rust_target: x86_64-apple-darwin
                      dmg_asset_arch: macos_x86_64
                      updater_target: macos-x86_64-stable
                      updater_asset_name: update_macos_x86_64.app.tar.gz
                      webkit_build_target: safari18.2
                      build_command: npm run tauri:build -- --target x86_64-apple-darwin --bundles app,dmg
                      artifact_name: macos-x86_64-dmg
                      artifact_path: |
                          target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
                          target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz
                          target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
        steps:
            - uses: actions/checkout@v7

            - uses: dtolnay/rust-toolchain@stable

            - name: Install Rust target
              if: matrix.rust_target != ''
              run: rustup target add "${{ matrix.rust_target }}"

            - uses: ./.github/actions/setup-node

            - name: Install Linux package dependencies
              if: runner.os == 'Linux'
              uses: ./.github/actions/setup-linux-tauri
              with:
                  mode: package

            - name: Inject updater public key
              env:
                  TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
              run: |
                  if [[ -z "$TAURI_UPDATER_PUBLIC_KEY" ]]; then
                      echo "TAURI_UPDATER_PUBLIC_KEY repository variable is required for updater artifacts" >&2
                      exit 1
                  fi
                  node -e "const fs = require('node:fs'); const path = 'src-tauri/tauri.conf.json'; const config = JSON.parse(fs.readFileSync(path, 'utf8')); config.plugins ??= {}; config.plugins.updater ??= {}; config.plugins.updater.pubkey = process.env.TAURI_UPDATER_PUBLIC_KEY; fs.writeFileSync(path, JSON.stringify(config, null, 4) + '\n');"

            - name: Build package
              env:
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY_PASSWORD }}
                  TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
                  VRCX_0_WEBKIT_BUILD_TARGET: ${{ matrix.webkit_build_target }}
              run: |
                  override_config="${RUNNER_TEMP}/tauri-release-override.json"
                  if [[ "${{ needs.prepare.outputs.channel }}" == "beta" ]]; then
                      if [[ "$RUNNER_OS" == "Linux" ]]; then
                          node -e "require('node:fs').writeFileSync(process.argv[1], JSON.stringify({ version: process.argv[2], bundle: { linux: { rpm: { release: '0.beta.' + process.argv[3] } } } }))" "$override_config" "${{ needs.prepare.outputs.base_version }}" "${{ needs.prepare.outputs.beta_number }}"
                      else
                          node -e "require('node:fs').writeFileSync(process.argv[1], JSON.stringify({ version: process.argv[2], bundle: { macOS: { bundleVersion: process.argv[3] } } }))" "$override_config" "${{ needs.prepare.outputs.base_version }}" "${{ github.run_number }}"
                      fi
                  fi

                  if [[ "$RUNNER_OS" == "Linux" ]]; then
                      VRCX_0_WEBKIT_BUILD_TARGET=safari17.4 \
                          npm run tauri:build -- \
                          --config src-tauri/tauri.linux.conf.json \
                          --no-bundle
                      if [[ "${{ needs.prepare.outputs.channel }}" == "beta" ]]; then
                          npm run tauri -- bundle \
                              --config src-tauri/tauri.linux.conf.json \
                              --bundles appimage deb
                          npm run tauri -- bundle \
                              --config "$override_config" \
                              --bundles rpm
                      else
                          npm run tauri -- bundle \
                              --config src-tauri/tauri.linux.conf.json \
                              --bundles appimage deb rpm
                      fi
                      exit 0
                  fi
                  if [[ "${{ needs.prepare.outputs.channel }}" == "beta" ]]; then
                      ${{ matrix.build_command }} --config "$override_config"
                  else
                      ${{ matrix.build_command }}
                  fi

            - name: Prepare Linux release and updater assets
              if: runner.os == 'Linux'
              run: |
                  bundle_dir="target/release/bundle"
                  manifest_path="$bundle_dir/latest_linux_and_macos.json"

                  find "$bundle_dir" -maxdepth 2 -type f | sort

                  rename_asset() {
                      local source="$1"
                      local destination="$2"
                      local source_signature="${source}.sig"
                      local destination_signature="${destination}.sig"

                      if [[ "$source" != "$destination" ]]; then
                          if [[ -e "$destination" ]]; then
                              echo "Target release asset already exists: $destination" >&2
                              exit 1
                          fi
                          mv "$source" "$destination"
                      fi

                      if [[ -f "$source_signature" && "$source_signature" != "$destination_signature" ]]; then
                          if [[ -e "$destination_signature" ]]; then
                              echo "Target release signature already exists: $destination_signature" >&2
                              exit 1
                          fi
                          mv "$source_signature" "$destination_signature"
                      fi

                      if [[ ! -f "$destination_signature" ]]; then
                          node node_modules/@tauri-apps/cli/tauri.js signer sign "$destination" > "$destination_signature"
                      fi
                      if [[ ! -s "$destination_signature" ]]; then
                          echo "No updater signature found at $destination_signature" >&2
                          exit 1
                      fi
                  }

                  appimage_source="$(find "$bundle_dir/appimage" -maxdepth 1 -name '*.AppImage' | sort | head -n 1)"
                  deb_source="$(find "$bundle_dir/deb" -maxdepth 1 -name '*.deb' | sort | head -n 1)"
                  rpm_source="$(find "$bundle_dir/rpm" -maxdepth 1 -name '*.rpm' | sort | head -n 1)"

                  if [[ -z "$appimage_source" || -z "$deb_source" || -z "$rpm_source" ]]; then
                      echo "Missing Linux release artifact. AppImage=$appimage_source deb=$deb_source rpm=$rpm_source" >&2
                      exit 1
                  fi

                  appimage_path="$bundle_dir/appimage/VRCX-0_${{ needs.prepare.outputs.build_version }}_linux_x86_64.AppImage"
                  deb_path="$bundle_dir/deb/VRCX-0_${{ needs.prepare.outputs.build_version }}_linux_x86_64.deb"
                  rpm_path="$bundle_dir/rpm/VRCX-0_${{ needs.prepare.outputs.build_version }}_linux_x86_64.rpm"

                  rename_asset "$appimage_source" "$appimage_path"
                  rename_asset "$deb_source" "$deb_path"
                  rename_asset "$rpm_source" "$rpm_path"

                  node scripts/create-tauri-updater-manifest.ts \
                      --version "${{ needs.prepare.outputs.build_version }}" \
                      --tag "${{ needs.prepare.outputs.tag }}" \
                      --target "linux-x86_64-appimage-stable" \
                      --asset-name "$(basename "$appimage_path")" \
                      --signature-file "${appimage_path}.sig" \
                      --out "$manifest_path"
                  node scripts/create-tauri-updater-manifest.ts \
                      --version "${{ needs.prepare.outputs.build_version }}" \
                      --tag "${{ needs.prepare.outputs.tag }}" \
                      --target "linux-x86_64-deb-stable" \
                      --asset-name "$(basename "$deb_path")" \
                      --signature-file "${deb_path}.sig" \
                      --base "$manifest_path" \
                      --out "$manifest_path"
                  node scripts/create-tauri-updater-manifest.ts \
                      --version "${{ needs.prepare.outputs.build_version }}" \
                      --tag "${{ needs.prepare.outputs.tag }}" \
                      --target "linux-x86_64-rpm-stable" \
                      --asset-name "$(basename "$rpm_path")" \
                      --signature-file "${rpm_path}.sig" \
                      --base "$manifest_path" \
                      --out "$manifest_path"

            - name: Prepare macOS release and updater assets
              if: runner.os == 'macOS'
              run: |
                  dmg_dir="target/${{ matrix.rust_target }}/release/bundle/dmg"
                  dmg_path="$(find "$dmg_dir" -maxdepth 1 -name '*.dmg' | sort | head -n 1)"
                  if [[ -z "$dmg_path" ]]; then
                      echo "No macOS DMG found in $dmg_dir" >&2
                      exit 1
                  fi
                  renamed_dmg="$dmg_dir/VRCX-0_${{ needs.prepare.outputs.build_version }}_${{ matrix.dmg_asset_arch }}.dmg"
                  if [[ "$dmg_path" != "$renamed_dmg" ]]; then
                      if [[ -e "$renamed_dmg" ]]; then
                          echo "Target macOS DMG already exists: $renamed_dmg" >&2
                          exit 1
                      fi
                      mv "$dmg_path" "$renamed_dmg"
                  fi

                  updater_dir="target/${{ matrix.rust_target }}/release/bundle/macos"
                  archive_path="$(find "$updater_dir" -maxdepth 1 -name '*.app.tar.gz' | sort | head -n 1)"
                  if [[ -z "$archive_path" ]]; then
                      echo "No macOS updater archive found in $updater_dir" >&2
                      exit 1
                  fi
                  signature_path="${archive_path}.sig"
                  if [[ ! -f "$signature_path" ]]; then
                      echo "No macOS updater signature found at $signature_path" >&2
                      exit 1
                  fi
                  renamed_archive="$updater_dir/${{ matrix.updater_asset_name }}"
                  mv "$archive_path" "$renamed_archive"
                  mv "$signature_path" "$renamed_archive.sig"

            - uses: actions/upload-artifact@v7
              with:
                  name: release-${{ matrix.artifact_name }}
                  path: ${{ matrix.artifact_path }}
                  if-no-files-found: error

    package-windows:
        name: Windows Installer
        needs: prepare
        runs-on: windows-latest
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@v7

            - uses: dtolnay/rust-toolchain@stable

            - uses: ./.github/actions/setup-node

            - name: Import Windows code signing certificate and trust chain
              shell: pwsh
              env:
                  WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
                  WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
              run: |
                  if (-not $env:WINDOWS_CERTIFICATE) {
                      Write-Error "WINDOWS_CERTIFICATE secret is required for signed Windows builds."
                      exit 1
                  }
                  $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
                  [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
                  $secrets = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force

                  # 离线读出整条链（EphemeralKeySet，不落盘私钥），供下面装进信任存储。
                  $chain = [System.Security.Cryptography.X509Certificates.X509Certificate2Collection]::new()
                  $chain.Import($pfx, $env:WINDOWS_CERTIFICATE_PASSWORD, [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet)

                  $imported = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secrets
                  Remove-Item $pfx -Force

                  # 把整条链（叶子除外）都装进用户级「受信任的根证书颁发机构」。
                  # 这是自建 CA，不追求公共信任链的分层语义，只要 signtool 能构建出
                  # 完整链即可。用户级存储不需要管理员权限；runner 是一次性的，这个
                  # 信任状态不会离开本次构建，也不会让最终用户的机器信任这组自建 CA。
                  $rootStore = [System.Security.Cryptography.X509Certificates.X509Store]::new('Root', 'CurrentUser')
                  $rootStore.Open('ReadWrite')
                  try {
                      foreach ($cert in $chain) {
                          if ($cert.Thumbprint -eq $imported.Thumbprint) { continue }
                          $rootStore.Add($cert)
                      }
                  } finally {
                      $rootStore.Close()
                  }

                  $thumb = $imported.Thumbprint
                  if (-not $thumb) {
                      Write-Error "Imported certificate has no thumbprint."
                      exit 1
                  }

                  # 证书指纹属于环境信息，不落进仓库：从刚导入的证书直接读出来注入配置。
                  # 这样换证书只需要换 secret，不必改任何提交。
                  $env:CODESIGN_THUMBPRINT = $thumb
                  node -e "const fs=require('node:fs');const p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.bundle??={};c.bundle.windows??={};c.bundle.windows.certificateThumbprint=process.env.CODESIGN_THUMBPRINT;fs.writeFileSync(p,JSON.stringify(c,null,4)+'\n');"

            - name: Show signing certificate (public fields only)
              shell: pwsh
              run: |
                  # 只打印证书的公开字段，任何私钥材料都不输出、不导出。
                  # 指纹来自上一步从导入证书注入的配置值。
                  $config = Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
                  $thumb = $config.bundle.windows.certificateThumbprint
                  if (-not $thumb) {
                      Write-Error "bundle.windows.certificateThumbprint is not set in tauri.conf.json."
                      exit 1
                  }
                  $cert = Get-ChildItem Cert:\CurrentUser\My | Where-Object { $_.Thumbprint -eq $thumb }
                  if (-not $cert) {
                      Write-Error "Code signing certificate $thumb was not found in CurrentUser\My after import."
                      exit 1
                  }
                  Write-Host "Subject      : $($cert.Subject)"
                  Write-Host "Issuer       : $($cert.Issuer)"
                  Write-Host "Thumbprint   : $($cert.Thumbprint)"
                  Write-Host "SerialNumber : $($cert.SerialNumber)"
                  Write-Host "NotBefore    : $($cert.NotBefore.ToUniversalTime().ToString('o'))"
                  Write-Host "NotAfter     : $($cert.NotAfter.ToUniversalTime().ToString('o'))"
                  Write-Host "HasPrivateKey: $($cert.HasPrivateKey)"
                  $eku = ($cert.EnhancedKeyUsageList | ForEach-Object { "$($_.FriendlyName) ($($_.ObjectId))" }) -join ', '
                  Write-Host "EKU          : $eku"

            - name: Inject updater public key
              env:
                  TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
              run: |
                  if [[ -z "$TAURI_UPDATER_PUBLIC_KEY" ]]; then
                      echo "TAURI_UPDATER_PUBLIC_KEY repository variable is required for updater artifacts" >&2
                      exit 1
                  fi
                  node -e "const fs = require('node:fs'); const path = 'src-tauri/tauri.conf.json'; const config = JSON.parse(fs.readFileSync(path, 'utf8')); config.plugins ??= {}; config.plugins.updater ??= {}; config.plugins.updater.pubkey = process.env.TAURI_UPDATER_PUBLIC_KEY; fs.writeFileSync(path, JSON.stringify(config, null, 4) + '\n');"

            - name: Build Windows installer
              env:
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY_PASSWORD }}
              run: npm run tauri:build -- --bundles nsis

            - name: Prepare Windows release and updater assets
              run: |
                  bundle_dir="target/release/bundle/nsis"
                  installer="$(find "$bundle_dir" -maxdepth 1 -name '*-setup.exe' | sort | head -n 1)"
                  if [[ -z "$installer" ]]; then
                      echo "No Windows installer found in $bundle_dir" >&2
                      exit 1
                  fi

                  renamed="$bundle_dir/VRCX-0_${{ needs.prepare.outputs.build_version }}_windows_x86_64_setup.exe"
                  if [[ "$installer" != "$renamed" ]]; then
                      if [[ -e "$renamed" ]]; then
                          echo "Target installer already exists: $renamed" >&2
                          exit 1
                      fi
                      mv "$installer" "$renamed"
                  fi

                  if [[ ! -f "${renamed}.sig" ]]; then
                      echo "No updater signature found at ${renamed}.sig" >&2
                      exit 1
                  fi

                  node scripts/create-tauri-updater-manifest.ts \
                      --version "${{ needs.prepare.outputs.build_version }}" \
                      --tag "${{ needs.prepare.outputs.tag }}" \
                      --target "windows-x86_64-stable" \
                      --asset-name "$(basename "$renamed")" \
                      --signature-file "${renamed}.sig" \
                      --out "$bundle_dir/latest_windows.json"

            - uses: actions/upload-artifact@v7
              with:
                  name: release-windows
                  path: |
                      target/release/bundle/nsis/*.exe
                      target/release/bundle/nsis/latest_windows.json
                  if-no-files-found: error

    logger:
        name: Logger (${{ matrix.platform }} ${{ matrix.arch }})
        needs: prepare
        runs-on: ${{ matrix.os }}
        defaults:
            run:
                shell: bash
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: linux
                      arch: x86_64
                      os: ubuntu-24.04
                      rust_target: x86_64-unknown-linux-musl
                      exe_suffix: ''
                      notices: true
                      notices_suffix: ''
                    - platform: linux
                      arch: aarch64
                      os: ubuntu-24.04-arm
                      rust_target: aarch64-unknown-linux-musl
                      exe_suffix: ''
                      notices: false
                      notices_suffix: ''
                    - platform: windows
                      arch: x86_64
                      os: windows-latest
                      rust_target: x86_64-pc-windows-msvc
                      exe_suffix: .exe
                      notices: true
                      notices_suffix: _windows_x86_64
        env:
            CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
        steps:
            - uses: actions/checkout@v7

            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.rust_target }}

            - name: Install musl toolchain
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y musl-tools

            - name: Build logger
              run: cargo build --locked --release -p vrcx-0-logger --target "${{ matrix.rust_target }}"

            - name: Prepare logger asset
              run: |
                  mkdir -p logger-assets
                  cp "target/${{ matrix.rust_target }}/release/vrcx-0-logger${{ matrix.exe_suffix }}" "logger-assets/vrcx-0-logger_${{ needs.prepare.outputs.build_version }}_${{ matrix.platform }}_${{ matrix.arch }}${{ matrix.exe_suffix }}"

            - uses: actions/setup-node@v6
              if: matrix.notices
              with:
                  node-version: 24.x

            - name: Generate logger third-party notices
              if: matrix.notices
              run: node scripts/generate-third-party-licenses.ts --logger "logger-assets/vrcx-0-logger_${{ needs.prepare.outputs.build_version }}${{ matrix.notices_suffix }}_THIRD_PARTY_NOTICES.txt" --target "${{ matrix.rust_target }}"

            - uses: actions/upload-artifact@v7
              with:
                  name: release-logger-${{ matrix.platform }}-${{ matrix.arch }}
                  path: logger-assets/*
                  if-no-files-found: error

    publish-draft:
        name: Publish Draft Release
        needs:
            - prepare
            - package
            - package-windows
            - logger
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v6
              with:
                  node-version: 24.x

            - uses: actions/download-artifact@v8
              with:
                  path: release-assets
                  merge-multiple: true

            - name: Flatten release assets
              run: |
                  find release-assets -mindepth 2 -type f -print0 | while IFS= read -r -d '' file; do
                      destination="release-assets/$(basename "$file")"
                      if [[ -e "$destination" ]]; then
                          echo "Duplicate release asset basename: $destination" >&2
                          exit 1
                      fi
                      mv "$file" "$destination"
                  done
                  find release-assets -mindepth 1 -type d -empty -delete

            - name: List prepared release assets
              run: find release-assets -type f | sort

            - name: Add macOS updater entries to Linux/macOS manifest
              run: |
                  manifest_path="release-assets/latest_linux_and_macos.json"
                  if [[ ! -f "$manifest_path" ]]; then
                      echo "No Linux/macOS updater manifest found at $manifest_path" >&2
                      exit 1
                  fi

                  for target in macos-aarch64-stable macos-x86_64-stable; do
                      archive_name="update_${target%-stable}.app.tar.gz"
                      archive_name="${archive_name//-/_}"
                      archive_path="release-assets/$archive_name"
                      if [[ ! -f "$archive_path" ]]; then
                          echo "No macOS updater archive found for $target" >&2
                          exit 1
                      fi
                      signature_path="${archive_path}.sig"
                      if [[ ! -f "$signature_path" ]]; then
                          echo "No macOS updater signature found at $signature_path" >&2
                          exit 1
                      fi
                      node scripts/create-tauri-updater-manifest.ts \
                          --version "${{ needs.prepare.outputs.build_version }}" \
                          --tag "${{ needs.prepare.outputs.tag }}" \
                          --target "$target" \
                          --asset-name "$(basename "$archive_path")" \
                          --signature-file "$signature_path" \
                          --base "$manifest_path" \
                          --out "$manifest_path"
                  done

            - name: Remove updater signatures from GitHub release assets
              run: find release-assets -type f -name '*.sig' -delete

            - name: List GitHub release assets
              run: find release-assets -type f | sort

            - uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ needs.prepare.outputs.tag }}
                  name: ${{ needs.prepare.outputs.display_version }}
                  body: Draft release for ${{ needs.prepare.outputs.display_version }}.
                  draft: true
                  prerelease: ${{ needs.prepare.outputs.prerelease }}
                  files: release-assets/*
                  fail_on_unmatched_files: true
                  overwrite_files: true
